[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-workenv"
dynamic = ["version"]
description = "Development workspace setup for the provide.io ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Provide", email = "support@provide.io" }
]

[project.urls]
Homepage = "https://foundry.provide.io/provide-workspace/"
Documentation = "https://foundry.provide.io/provide-workspace/"
Repository = "https://foundry.provide.io/provide-workspace/repo"
Issues = "https://foundry.provide.io/provide-workspace/issues"

# Optional workspace-level dependencies
# Individual projects manage their own dependencies
dependencies = [
    "provide-foundation[all]",
]

[project.optional-dependencies]
dev = [
    "provide-testkit[all]",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 111
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
