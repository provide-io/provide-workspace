#
# provide-workspace/pyproject.toml
#
# Development workspace bootstrapper for the provide.io ecosystem.
#
# Usage:
#   Clone provide-workspace, then clone repos into the repos/ subdirectory:
#     cd provide-workspace
#     git clone git@github.com:provide-io/pyvider.git repos/pyvider
#     # ... etc
#     uv sync
#

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-workspace"
version = "0.0.0"
description = "Development workspace bootstrapper for the provide.io ecosystem"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "provide-foundation>=0.3.21,<0.4",
    "tomli>=2.2.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-autorefs>=1.4.0",
    "mkdocs-monorepo-plugin>=1.1.0",
    "mkdocs-macros-plugin>=1.0.0",
    "mkdocs-autolinks-plugin>=0.7.0",
    "mike>=2.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-htmlproofer-plugin>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/provide-io/provide-workspace"
Repository = "https://github.com/provide-io/provide-workspace"
Issues = "https://github.com/provide-io/provide-workspace/issues"

[tool.uv.sources]
flavorpack              = { path = "repos/flavorpack",              editable = true }
plating                 = { path = "repos/plating",                 editable = true }
provide-foundation      = { path = "repos/provide-foundation",      editable = true }
provide-foundry         = { path = "repos/provide-foundry",         editable = true }
provide-testkit         = { path = "repos/provide-testkit",         editable = true }
pyvider                 = { path = "repos/pyvider",                 editable = true }
pyvider-components      = { path = "repos/pyvider-components",      editable = true }
pyvider-cty             = { path = "repos/pyvider-cty",             editable = true }
pyvider-hcl             = { path = "repos/pyvider-hcl",             editable = true }
pyvider-rpcplugin       = { path = "repos/pyvider-rpcplugin",       editable = true }
supsrc                  = { path = "repos/supsrc",                  editable = true }
terraform-provider-pyvider = { path = "repos/terraform-provider-pyvider", editable = true }
tofusoup                = { path = "repos/tofusoup",                editable = true }
wrknv                   = { path = "repos/wrknv",                   editable = true }

[tool.setuptools]
packages = []
