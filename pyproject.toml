#
# provide-workspace/pyproject.toml
#
# Development workspace bootstrapper for the provide.io ecosystem.
#
# Usage:
#   Clone all provide-io repos into the same parent directory, then:
#     cd provide-workspace && uv sync
#
#   This installs all sibling repos as editable local packages via symlinks.
#

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provide-workspace"
version = "0.0.0"
description = "Development workspace bootstrapper for the provide.io ecosystem"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
dependencies = [
    "flavorpack",
    "plating",
    "provide-foundation",
    "provide-foundry",
    "provide-testkit",
    "pyvider",
    "pyvider-components",
    "pyvider-cty",
    "pyvider-hcl",
    "pyvider-rpcplugin",
    "supsrc",
    "terraform-provider-pyvider",
    "tofusoup",
    "wrknv",
]

[tool.uv.sources]
flavorpack              = { path = "flavorpack",              editable = true }
plating                 = { path = "plating",                 editable = true }
provide-foundation      = { path = "provide-foundation",      editable = true }
provide-foundry         = { path = "provide-foundry",         editable = true }
provide-testkit         = { path = "provide-testkit",         editable = true }
pyvider                 = { path = "pyvider",                 editable = true }
pyvider-components      = { path = "pyvider-components",      editable = true }
pyvider-cty             = { path = "pyvider-cty",             editable = true }
pyvider-hcl             = { path = "pyvider-hcl",             editable = true }
pyvider-rpcplugin       = { path = "pyvider-rpcplugin",       editable = true }
supsrc                  = { path = "supsrc",                  editable = true }
terraform-provider-pyvider = { path = "terraform-provider-pyvider", editable = true }
tofusoup                = { path = "tofusoup",                editable = true }
wrknv                   = { path = "wrknv",                   editable = true }

[tool.setuptools]
packages = []
