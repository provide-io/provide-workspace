# Minimal CI for provide-workspace.
#
# This repo is a workspace bootstrapper: no source code, no tests.
# It wires sibling provide-io repos together via `[tool.uv.sources]`
# editable paths. CI validates that:
#
#   1. pyproject.toml parses and agrees with itself,
#   2. pre-commit hooks pass on the config + docs,
#   3. REUSE licensing annotations are valid.
#
# Nothing here resolves the workspace, and nothing here can. uv refuses to
# resolve a workspace whose members are absent -- `uv sync`, `uv lock` and a
# bare `uv run` all fail with "references a workspace in tool.uv.sources ...
# but is not a workspace member" -- and CI deliberately does not clone twelve
# sibling repos on every push. This job used to run `uv sync
# --no-install-workspace` in the belief that the flag skipped path-source
# resolution; it does not, it only skips installing the members, so the job
# failed on every push from the moment the sources were introduced.
#
# Every step that needs a tool therefore takes it with `--no-project`, which
# is what keeps uv from trying to resolve this project at all.
#
# Integration-level validation (running `uv sync` with all siblings cloned
# into repos/) stays local-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate workspace metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pre-commit's default_language_version pins python3.11 for hook envs.
      # Install 3.11 first (on PATH as python3.11) so pre-commit's
      # virtualenv -p python3.11 can find it; uv then provides 3.13 as the
      # workspace runtime alongside.
      - name: Set up Python 3.11 for pre-commit hooks
        # v6.0.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up uv
        # v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"

      # Checks what is visible without the siblings: that the manifest parses,
      # and that every workspace-routed source has a matching dependency and
      # vice versa. A source with no requirement is dead config; a sibling
      # requirement with no source silently resolves from PyPI, which defeats
      # the point of this repo.
      - name: Validate workspace metadata
        run: python3 ci/validate-workspace-metadata.py

      # --no-project: pre-commit is a tool this job needs, not a dependency of
      # this project, and resolving this project requires the absent siblings.
      - name: Run pre-commit
        run: uv run --no-project --with pre-commit pre-commit run --all-files --show-diff-on-failure

      # --no-project for the same reason as above.
      - name: REUSE lint
        run: uv run --no-project --with reuse reuse lint
